name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Проверить синтаксис Bash
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
      - name: Проверить доступность тестового API
        run: bash check_api.sh https://httpbin.org/status/200
