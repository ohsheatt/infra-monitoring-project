services:
  api:
    image: hashicorp/http-echo:1.0.0
    command: ["-text=Monitoring Service Active", "-listen=:8080"]
    expose:
      - "8080"
    networks:
      - monitoring

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
